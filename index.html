<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shh Chat 🤫</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0f2f5; font-family: Arial, sans-serif; }
    .card, #chat { width: min(100%, 800px); min-height: 100vh; background: white; }
    .card { min-height: auto; width: min(92%, 420px); padding: 32px; border-radius: 18px; box-shadow: 0 10px 30px #0002; text-align: center; }
    h1 { margin-top: 0; }
    input, button { width: 100%; padding: 13px; border-radius: 9px; font-size: 1rem; }
    input { margin: 7px 0; border: 1px solid #ccc; }
    button { margin-top: 9px; border: 0; color: white; background: #4285f4; cursor: pointer; font-weight: bold; }
    button.secondary { background: #34a853; }
    button:disabled { background: #aaa; cursor: wait; }
    #status { min-height: 22px; color: #666; margin: 15px 0; }
    #error { color: #c5221f; min-height: 20px; }
    #chat { display: none; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 20px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
    header h2 { margin: 0; font-size: 1.1rem; }
    header button { width: auto; margin: 0; padding: 8px 12px; background: white; color: #333; border: 1px solid #bbb; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; min-height: 55vh; }
    .message { max-width: 80%; margin: 10px 0; padding: 10px 14px; border-radius: 16px; background: #e9e9eb; overflow-wrap: anywhere; }
    .mine { margin-left: auto; color: white; background: #4285f4; }
    .sender { display: block; font-size: .75rem; opacity: .7; margin-bottom: 4px; }
    .system { margin: 12px auto; text-align: center; color: #666; font-size: .85rem; }
    #message-form { display: flex; gap: 8px; padding: 15px; border-top: 1px solid #ddd; }
    #message-form input { margin: 0; flex: 1; }
    #message-form button { width: auto; margin: 0; }
  </style>
</head>
<body>
  <section id="welcome" class="card">
    <h1>Shh Chat 🤫</h1>
    <p>Create a room or join one with a room code.</p>
    <div id="status">Connecting…</div>
    <div id="error" role="alert"></div>
    <input id="name" maxlength="30" placeholder="Your name" autocomplete="name">
    <input id="room-code" maxlength="8" placeholder="Room code (for joining)" autocomplete="off">
    <button id="create" type="button" disabled>Create new chat</button>
    <button id="join" class="secondary" type="button" disabled>Join chat</button>
  </section>

  <section id="chat">
    <header>
      <h2>Room: <span id="room-label"></span></h2>
      <button id="leave" type="button">Leave</button>
    </header>
    <main id="messages"><div class="system">No messages yet.</div></main>
    <form id="message-form">
      <input id="message" placeholder="Type a message…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, doc, getDoc, setDoc, addDoc, onSnapshot, serverTimestamp, query, orderBy } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyBAXWKvlpwnzI9Lghj81d1_M1pIRbuM200',
      authDomain: 'shh-chat-db9d0.firebaseapp.com',
      projectId: 'shh-chat-db9d0',
      storageBucket: 'shh-chat-db9d0.appspot.com',
      messagingSenderId: '20040883450',
      appId: '1:20040883450:web:833660405c634b2aaffd43'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);
    const welcome = $('welcome');
    const chat = $('chat');
    let user = null;
    let roomId = null;
    let unsubscribeMessages = null;

    function setError(message = '') { $('error').textContent = message; }
    function setBusy(busy) {
      $('create').disabled = busy || !user;
      $('join').disabled = busy || !user;
    }
    function explainError(error) {
      console.error(error);
      if (error.code === 'permission-denied') return 'Firebase denied access. Check Firestore rules.';
      if (error.code === 'auth/operation-not-allowed') return 'Enable Anonymous sign-in in Firebase Authentication.';
      if (error.code === 'unavailable') return 'Firebase is temporarily unavailable. Try again.';
      return error.message || 'Something went wrong. Try again.';
    }
    function newRoomCode() { return Math.random().toString(36).slice(2, 6).toUpperCase(); }

    onAuthStateChanged(auth, currentUser => {
      user = currentUser;
      if (user) {
        $('status').textContent = 'Ready';
        setBusy(false);
      } else {
        $('status').textContent = 'Connecting…';
        setBusy(true);
        signInAnonymously(auth).catch(error => {
          $('status').textContent = 'Connection failed';
          setError(explainError(error));
        });
      }
    });

    async function openRoom(id, name) {
      id = id.trim().toUpperCase();
      name = name.trim();
      if (!name) throw new Error('Enter your name first.');
      if (!id) throw new Error('Enter a room code.');

      const roomRef = doc(db, 'rooms', id);
      const room = await getDoc(roomRef);
      if (!room.exists()) throw new Error('Room not found. Create a new chat first.');

      await setDoc(doc(db, 'rooms', id, 'users', user.uid), {
        name, joinedAt: serverTimestamp(), isOnline: true
      });
      roomId = id;
      $('room-label').textContent = id;
      welcome.style.display = 'none';
      chat.style.display = 'flex';
      $('message').focus();
      listenForMessages();
    }

    async function createRoom() {
      const name = $('name').value;
      const id = newRoomCode();
      await setDoc(doc(db, 'rooms', id), { createdAt: serverTimestamp() });
      await openRoom(id, name);
    }

    $('create').addEventListener('click', async () => {
      setError(); setBusy(true);
      try { await createRoom(); } catch (error) { setError(explainError(error)); setBusy(false); }
    });

    $('join').addEventListener('click', async () => {
      setError(); setBusy(true);
      try { await openRoom($('room-code').value, $('name').value); } catch (error) { setError(explainError(error)); setBusy(false); }
    });

    function listenForMessages() {
      if (unsubscribeMessages) unsubscribeMessages();
      const messagesQuery = query(collection(db, 'rooms', roomId, 'messages'), orderBy('timestamp'));
      unsubscribeMessages = onSnapshot(messagesQuery, snapshot => {
        const container = $('messages');
        container.innerHTML = '';
        if (snapshot.empty) container.innerHTML = '<div class="system">No messages yet.</div>';
        snapshot.forEach(item => {
          const data = item.data();
          const element = document.createElement('div');
          element.className = `message ${data.senderId === user.uid ? 'mine' : ''}`;
          element.innerHTML = `<span class="sender"></span><span class="text"></span>`;
          element.querySelector('.sender').textContent = data.senderId === user.uid ? 'You' : (data.senderName || 'Anonymous');
          element.querySelector('.text').textContent = data.text || '';
          container.appendChild(element);
        });
        container.scrollTop = container.scrollHeight;
      }, error => setError(explainError(error)));
    }

    $('message-form').addEventListener('submit', async event => {
      event.preventDefault();
      const input = $('message');
      const text = input.value.trim();
      if (!text || !roomId || !user) return;
      input.disabled = true;
      try {
        await addDoc(collection(db, 'rooms', roomId, 'messages'), {
          text, senderId: user.uid, senderName: $('name').value.trim(), timestamp: serverTimestamp()
        });
        input.value = '';
      } catch (error) { setError(explainError(error)); }
      finally { input.disabled = false; input.focus(); }
    });

    $('leave').addEventListener('click', () => {
      if (unsubscribeMessages) unsubscribeMessages();
      unsubscribeMessages = null; roomId = null;
      chat.style.display = 'none'; welcome.style.display = 'block';
      $('room-code').value = ''; setError(); setBusy(false);
    });
  </script>
</body>
</html>
